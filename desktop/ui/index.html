<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MineM</title>
    <style>
      * { box-sizing: border-box; letter-spacing: 0; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f8fa; color: #172531; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(380px, calc(100vw - 48px)); padding: 32px; text-align: center; }
      .mark { width: 42px; height: 42px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: #168dca; box-shadow: 0 8px 22px rgba(22,141,202,.18); font-size: 20px; font-weight: 750; }
      .spinner { width: 20px; height: 20px; margin: 20px auto 0; border: 2px solid #d9e4ea; border-top-color: #168dca; border-radius: 50%; animation: spin .8s linear infinite; }
      h1 { margin: 0 0 9px; font-size: 21px; }
      p { margin: 0; color: #667986; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
      button { display: none; height: 34px; margin: 20px auto 0; padding: 0 18px; border: 1px solid #0878b6; border-radius: 6px; color: #fff; background: #168dca; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
      button:hover { background: #0878b6; }
      button:disabled { opacity: .55; cursor: default; }
      body[data-state="failed"] .spinner { display: none; }
      body[data-state="failed"] .mark { background: #c94c43; box-shadow: 0 8px 22px rgba(201,76,67,.14); }
      body[data-state="failed"] button { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>正在启动 MineM</h1>
      <p>正在准备本机工作空间</p>
      <div class="spinner" aria-hidden="true"></div>
      <button id="retry" type="button">重新连接</button>
    </main>
    <script>
      window.setMineMBootState = (state, message) => {
        document.body.dataset.state = state;
        document.querySelector("h1").textContent =
          state === "failed" ? "MineM 未能启动" : "正在启动 MineM";
        document.querySelector("p").textContent = message || (
          state === "failed"
            ? "本机服务尚未就绪"
            : "正在准备本机工作空间"
        );
      };
      document.querySelector("#retry").onclick = async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = "正在重试";
        document.body.dataset.state = "retrying";
        document.querySelector("h1").textContent = "正在重新连接";
        document.querySelector("p").textContent = "正在检查本机服务";
        try {
          const url = await window.__TAURI__.core.invoke("retry_runtime");
          window.location.assign(url);
        } catch (error) {
          button.disabled = false;
          button.textContent = "重新连接";
          window.setMineMBootState("failed", String(error));
        }
      };
    </script>
  </body>
</html>
