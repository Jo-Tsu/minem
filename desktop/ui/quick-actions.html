<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MineM 创作助手</title>
    <link rel="stylesheet" href="./quick-actions.css" />
  </head>
  <body>
    <main class="drawer" id="drawer">
      <header class="topbar" data-tauri-drag-region>
        <div class="brand">
          <span class="mark">M</span>
          <span class="brand-copy">
            <strong>创作助手</strong>
            <span class="native-state" id="native-state"><i></i>正在连接</span>
          </span>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="collapse" type="button" title="收起（⌥⌘M）" aria-label="收起"></button>
          <button class="icon-button" id="close" type="button" title="关闭" aria-label="关闭"></button>
        </div>
      </header>

      <section class="cli-gate" id="cli-gate" aria-live="polite">
        <span class="gate-icon" id="gate-icon"></span>
        <h1 id="cli-gate-title">正在准备 CLI</h1>
        <p id="cli-gate-copy">正在连接 MineM 本地能力。</p>
        <button class="primary compact" id="cli-gate-install" type="button" disabled>修复 CLI</button>
        <div class="gate-status" id="cli-gate-status">正在检查</div>
      </section>

      <section class="workspace" id="workspace" hidden>
        <div class="mode-switch" role="tablist" aria-label="创作场景">
          <button class="mode-button active" data-mode="report" role="tab" aria-selected="true" title="汇报" aria-label="汇报"></button>
          <button class="mode-button" data-mode="page" role="tab" aria-selected="false" title="页面" aria-label="页面"></button>
          <button class="mode-button" data-mode="case" role="tab" aria-selected="false" title="案例" aria-label="案例"></button>
        </div>

        <section class="scenario-list" id="scenarios" aria-label="可复制的场景指令"></section>

        <footer class="footer">
          <span class="status" id="status" aria-live="polite">复制后粘贴到 AI 对话</span>
          <span class="footer-mark" id="footer-mark"></span>
        </footer>
      </section>
    </main>

    <button class="launcher" id="drawer-launcher" type="button" title="点击展开，拖动移动" aria-label="展开或移动创作助手">
      <span class="launcher-mark">M</span>
    </button>
    <div class="toast" id="toast" role="status" aria-live="assertive" aria-atomic="true"></div>
    <script type="module" src="./quick-actions.js"></script>
  </body>
</html>
